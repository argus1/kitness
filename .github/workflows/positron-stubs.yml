name: Positron Stub Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-positron-stubs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Positron stub files
        run: bash scripts/check_positron_stubs.sh
